[package]
name = "ais-tracing"
version = "0.1.31"
edition = "2024"
license-file = "LICENSE"

[dependencies]
arboard = "3"
azure_core = "1.1.0"
azure_data_cosmos = "0.37.1"
azure_identity = "1.0.0"
chrono = "0.4.42"
dark-light = "2.0.0"
dioxus = { version = "0.7.10", features = ["desktop"] }
dirs = "6.0.0"
futures = "0.3.34"
# Decodes assets/icon.png into the runtime window icon. Already in the tree
# transitively; png is the only format needed.
image = { version = "0.25", default-features = false, features = ["png"] }
# Only used by `update_check`. rustls rather than the default native-tls
# so the Linux build needs no system OpenSSL, matching ais-analytics.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Not keyed on the host: build.rs decides from CARGO_CFG_TARGET_OS, so the
# crate has to be present whenever the *target* might be Windows — a
# `cfg(windows)` here would leave it missing on exactly the cross build that
# needs it.
base64 = "0.22"
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[build-dependencies]
winresource = "0.1"

# ── Debug build size ─────────────────────────────────────────────────────────
# target/ had grown to 9.1 GB, and almost none of it was the dependencies: the
# 443 dependency rlibs came to 1.15 GB, while this crate's own object files
# came to 2.70 GB across 15,104 files and target/debug/incremental to 4.6 GB.
# `rsx!` expands into deeply nested generic component trees, so with the stock
# `debug = true` every instantiation carries full DWARF.
#
# An application crate is hashed over its whole dependency graph, so each
# dependency change mints a fresh generation of *this* crate's objects — 31
# Cargo.lock changes had left 54 of them — and Cargo never collects any of it.
# Line tables keep file:line in panic backtraces, which is the part we read;
# the dependencies get no debuginfo at all. Set `debug = 2` here temporarily
# when you need a real debugger over dependency frames.
#
# target/debug/incremental is never pruned either, so clear it when it grows:
# `rm -rf target/debug/incremental`, or `cargo sweep --time 15` for the stale
# generations alongside it.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
