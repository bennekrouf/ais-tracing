[package]
name = "ais-tracing"
version = "0.1.2"
edition = "2024"

[dependencies]
azure_core = "1.1.0"
azure_data_cosmos = "0.37.1"
azure_identity = "1.0.0"
chrono = "0.4.42"
dark-light = "2.0.0"
dioxus = { version = "0.7.10", features = ["desktop"] }
dirs = "6.0.0"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
